spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

spendwise.auth.google-success-redirect-url=${GOOGLE_SUCCESS_REDIRECT_URL:http://localhost:5173/app/dashboard}
spendwise.auth.automation-service-token=${SPENDWISE_AUTOMATION_SERVICE_TOKEN:}
spendwise.auth.telegram-service-token=${SPENDWISE_TELEGRAM_SERVICE_TOKEN:}
spendwise.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
spendwise.telegram.invite-expiration-minutes=${TELEGRAM_INVITE_EXPIRATION_MINUTES:30}
spendwise.auth.backend-base-url=${BACKEND_BASE_URL:http://localhost:8080}
spendwise.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
spendwise.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spendwise.jwt.issuer=${SPENDWISE_JWT_ISSUER:spendwise-backend}
spendwise.jwt.audience=${SPENDWISE_JWT_AUDIENCE:spendwise-frontend}
spendwise.jwt.private-key=${SPENDWISE_JWT_PRIVATE_KEY:}
spendwise.jwt.public-key=${SPENDWISE_JWT_PUBLIC_KEY:}
spendwise.jwt.access-token-minutes=${SPENDWISE_JWT_ACCESS_TOKEN_MINUTES:10}
spendwise.jwt.refresh-token-days=${SPENDWISE_JWT_REFRESH_TOKEN_DAYS:30}
spendwise.jwt.refresh-cookie-secure=${SPENDWISE_JWT_REFRESH_COOKIE_SECURE:false}
spendwise.jwt.refresh-cookie-same-site=${SPENDWISE_JWT_REFRESH_COOKIE_SAME_SITE:Lax}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
server.forward-headers-strategy=framework

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.spendwise=${SPENDWISE_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId}] %logger{36} - %msg%n%ex
